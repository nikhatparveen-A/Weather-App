 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>Document</title>
  
    <style>
      body{
        display:flex;
        justify-content: center;
        align-items: center;
      }
      #display {
        height: 450px;
        width: 300px;
        border: 2px solid black ;
        padding: 20px;
        background-color: rgb(252, 223, 223);
        position: relative;
      }
      #random-box {
        height: 20px;
        width: 20px;
        background-color: brown;
        position: absolute;
        cursor: pointer;
      }
    </style>
 
  </head>
  <body>

    <div id="root"></div> 
    
  <script type="text/babel">
  let score = 0;

  function ClickBoxGame() {
    const handleClick = (e) => {
      const box = e.target;

      // calculate score
      score++
      document.getElementById("score").innerText = score

      // move box
      let x = Math.random() * 260;
      let y = Math.random() * 390;
      box.style.transform = `translate(${x}px,${y}px)`
    };

  return (
      <div id="display">
        <h3>
              Score: <span id="score">0</span>
          </h3>
        <div id="random-box" onClick={handleClick}></div>
      </div>
    )
    } 

  const root = document.getElementById("root");
  ReactDOM.render(<ClickBoxGame />, root);

</script>


  </body>
</html>
